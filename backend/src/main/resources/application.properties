# Server Configuration
server.port=8080

# Database Configuration
# Set DB_URL, DB_USERNAME, and DB_PASSWORD in the environment before starting.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense_tracker?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
# The schema is managed by the SQL migration files in database/migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
# JWT_SECRET must be at least 32 bytes. Set it in the environment, never in source.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# One-time first-admin setup. Leave these unset after bootstrapping.
app.bootstrap.admin-name=${BOOTSTRAP_ADMIN_NAME:Administrator}
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.assign-legacy-expenses=${ASSIGN_LEGACY_EXPENSES:false}

# Validation
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
JWT_SECRET=${JWT_SECRET}

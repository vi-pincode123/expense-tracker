<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Track income and expenses with a responsive dashboard, charts, filters, and CSV export." />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        var theme = 'light';
        try {
          var stored = window.localStorage.getItem('expense-tracker-theme');
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          ) {
            theme = 'dark';
          }
        } catch (error) {
          if (
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          ) {
            theme = 'dark';
          }
        }

        document.documentElement.setAttribute('data-theme', theme);

        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
          themeColor.setAttribute('content', theme === 'dark' ? '#0b1120' : '#4f46e5');
        }
      })();
    </script>
    <title>Expense Tracker | Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
